name: AE2 Cable Tiers build and game tests
on:
  push:
    branches: [codex/ae2-cable-tiers]
    paths:
      - 'AE2_线缆拓展/**'
      - '.github/workflows/ae2-cable-tiers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and run actual AE2 game tests
        id: build
        working-directory: AE2_线缆拓展
        shell: bash
        run: |
          mkdir -p verification
          set +e
          ./gradlew --no-daemon build runGameTestServer --console=plain > verification/build.log 2>&1
          build_status=$?
          echo "exit_code=$build_status" >> "$GITHUB_OUTPUT"
          tail -100 verification/build.log
          exit 0
      - name: Save exact outcome and successful binary to the work branch
        env:
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, hashlib, shutil
          from pathlib import Path
          root = Path('AE2_线缆拓展')
          result = {'source_commit': os.environ['SOURCE_COMMIT'], 'exit_code': int(os.environ['BUILD_EXIT']), 'run_url': os.environ['RUN_URL']}
          if result['exit_code'] == 0:
              binary = root / 'build/libs/ae2-cable-tiers-1.0.0.jar'
              target = root / binary.name
              shutil.copyfile(binary, target)
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              (root / (target.name + '.sha256')).write_text(digest + '  ' + target.name + '\n')
              result['sha256'] = digest
          (root / 'verification/result.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AE2_线缆拓展/verification
          if [ "${BUILD_EXIT}" = '0' ]; then
            git add AE2_线缆拓展/ae2-cable-tiers-1.0.0.jar AE2_线缆拓展/ae2-cable-tiers-1.0.0.jar.sha256
          fi
          git diff --cached --quiet || git commit -m 'Record AE2 build and game-test result [skip ci]'
          git push origin HEAD:${{ github.ref_name }}
      - name: Report failure
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
