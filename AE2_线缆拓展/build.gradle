plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.74'
}
version = '1.0.0'
group = 'dev.datapacksmods'
base { archivesName = 'ae2-cable-tiers' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories { mavenCentral() }
dependencies {
    implementation 'org.appliedenergistics:appliedenergistics2:19.2.18'
}
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
neoForge {
    version = '21.1.169'
    mods { ae2_cable_tiers { sourceSet sourceSets.main; sourceSet sourceSets.gametest } }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            loadedMods = [mods.ae2_cable_tiers]
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ae2_cable_tiers'
        }
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
jar { from('LICENSE'); from('NOTICE.md') }
